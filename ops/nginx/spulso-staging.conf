server {
    listen 80;
    listen [::]:80;
    server_name spulso.altaterraresources.com.pe;

    client_max_body_size 26m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /api-backend/asistencia/marcacion-personal {
        proxy_pass http://127.0.0.1:3101/asistencia/marcacion-personal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api-backend/trabajadores/actualizar-pin-marcacion {
        proxy_pass http://127.0.0.1:3101/trabajadores/actualizar-pin-marcacion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-backend/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
