server {
    listen 80;
    listen [::]:80;
    server_name spulso.altaterraresources.com.pe;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spulso.altaterraresources.com.pe;

    ssl_certificate /etc/letsencrypt/live/spulso.altaterraresources.com.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spulso.altaterraresources.com.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SPulsoTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 26m;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api-backend/asistencia/marcacion-personal {
        proxy_pass http://127.0.0.1:3101/asistencia/marcacion-personal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api-backend/trabajadores/actualizar-pin-marcacion {
        proxy_pass http://127.0.0.1:3101/trabajadores/actualizar-pin-marcacion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api-backend/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
